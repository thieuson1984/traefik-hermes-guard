<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .container {
    text-align: center;
    padding: 48px 32px;
    max-width: 520px;
  }
  .icon {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 2.5; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #fff; }
  p { font-size: 15px; line-height: 1.6; color: #a0a0a0; margin-bottom: 8px; }
  .details { 
    background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    padding: 12px 16px; margin: 16px auto; max-width: 320px; text-align: left;
    font-size: 13px; color: #888;
  }
  .details span { color: #f59e0b; }
  .ref { font-size: 12px; color: #666; margin-top: 32px; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
    </div>
    <h1>Access Denied</h1>
    <p>Your request has been blocked by our security system.</p>
    <div class="details">
      <div>Client IP: <span>{{.ClientIP}}</span></div>
      <div>Reason: <span>{{.Reason}}</span></div>
    </div>
    <p>If you believe this is a mistake, please contact the site administrator.</p>
    <div class="ref">Protected by Hermes Guard</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Check</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .container {
    text-align: center;
    padding: 48px 32px;
    max-width: 460px;
  }
  .icon {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 2.5; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #fff; }
  p { font-size: 15px; line-height: 1.6; color: #a0a0a0; margin-bottom: 8px; }
  .turnstile-wrap { margin: 28px auto; display: flex; justify-content: center; }
  .details { 
    background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    padding: 12px 16px; margin: 16px auto; max-width: 320px; text-align: left;
    font-size: 13px; color: #888;
  }
  .details span { color: #f59e0b; }
  .ref { font-size: 12px; color: #666; margin-top: 32px; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Security Check Required</h1>
    <p>We detected unusual activity from your connection.</p>
    <div class="details">
      <div>Client IP: <span>{{.ClientIP}}</span></div>
      <div>Reason: <span>{{.Reason}}</span></div>
    </div>
    <p>Please complete the verification below to continue.</p>
    <div class="turnstile-wrap">
      <div class="cf-turnstile" data-sitekey="TURNSTILE_SITE_KEY" data-callback="onTurnstileSuccess"></div>
    </div>
    <p>After verification, you will be redirected to your original page.</p>
    <div class="ref">Hermes Guard &mdash; Cloudflare Turnstile</div>
  </div>
  <script>
    function onTurnstileSuccess(token) {
      var currentUrl = new URL(window.location.href);
      var params = new URLSearchParams(currentUrl.search);
      params.set('hg_token', token);
      currentUrl.search = params.toString();
      window.location.href = currentUrl.toString();
    }
  </script>
</body>
</html>
